[package]
name = "cernbox-sync-gui"
version = "0.1.0"
description = "CERNBox Sync GUI"
authors = []
edition = "2021"

[lib]
name = "cernbox_sync_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cernbox-sync-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
