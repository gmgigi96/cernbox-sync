# Minimal stand-in for the CERNBox web UI: revad redirects the browser of a
# login flow to <webui_url>/login-flow/<token>, where this page lets a demo user
# grant or deny access. /ocs/ is proxied to revad so the page calls the grant
# API on its own origin (no CORS).
server {
    listen 80;
    root /usr/share/nginx/html;

    location /login-flow/ {
        try_files /index.html =404;
    }

    location /ocs/ {
        proxy_pass http://revad:80;
        # The page sends the credentials itself; without this a wrong password
        # would make the browser pop up its own Basic-Auth dialog.
        proxy_hide_header WWW-Authenticate;
    }

    location / {
        return 404;
    }
}
