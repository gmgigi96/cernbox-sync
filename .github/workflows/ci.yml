name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

  gui-tests:
    name: GUI Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Run GUI unit tests
        run: make test-gui

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: make build

      - name: Start dev services
        run: make dev-up

      - name: Wait for revad to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost/remote.php/webdav/; then
              echo "revad is up"
              break
            fi
            echo "Waiting for revad... ($i/30)"
            sleep 10
          done

      - name: Run integration tests
        run: make test-integration

      - name: Stop dev services
        if: always()
        run: make dev-down

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies and Playwright browsers
        run: cd gui && npm install && npx playwright install --with-deps chromium

      - name: Start dev services
        run: make dev-up

      - name: Wait for revad to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost/remote.php/webdav/; then
              echo "revad is up"
              break
            fi
            echo "Waiting for revad... ($i/30)"
            sleep 10
          done

      - name: Run e2e tests
        run: make test-e2e

      - name: Stop dev services
        if: always()
        run: make dev-down
