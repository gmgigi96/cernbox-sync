name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

  integration-tests:
    name: Integration Tests
    # eos-storage requires privileged mode and sysctls not available on
    # GitHub-hosted runners; use a self-hosted runner that supports this.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: make build

      - name: Start dev services
        run: make dev-up

      - name: Wait for revad to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost/remote.php/webdav/; then
              echo "revad is up"
              break
            fi
            echo "Waiting for revad... ($i/30)"
            sleep 10
          done

      - name: Run integration tests
        run: make test-integration

      - name: Stop dev services
        if: always()
        run: make dev-down

  gui-tests:
    name: GUI Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Run GUI unit tests
        run: make test-gui
