name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

  lint-gui:
    name: Lint GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install GUI dependencies
        run: cd gui && npm ci

      - name: TypeScript type-check
        run: cd gui && ./node_modules/.bin/tsc --noEmit

  build:
    name: Build (${{ matrix.os }})
    needs: [lint-go, lint-gui]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go binaries
        run: |
          go build -o cernbox-sync .
          go build -o cernbox-syncd ./cmd/cernbox-syncd

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install GUI dependencies
        run: cd gui && npm ci

      - name: Build GUI frontend
        run: cd gui && npm run build

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

  gui-tests:
    name: GUI Unit Tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Run GUI unit tests
        run: make test-gui

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: make build

      - name: Start dev services
        run: make dev-up

      - name: Wait for revad to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost/remote.php/webdav/; then
              echo "revad is up"
              break
            fi
            echo "Waiting for revad... ($i/30)"
            sleep 10
          done

      - name: Run integration tests
        run: make test-integration

      - name: Stop dev services
        if: always()
        run: make dev-down

  e2e-tests:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies and Playwright browsers
        run: cd gui && npm install && npx playwright install --with-deps chromium

      - name: Start dev services
        run: make dev-up

      - name: Wait for revad to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost/remote.php/webdav/; then
              echo "revad is up"
              break
            fi
            echo "Waiting for revad... ($i/30)"
            sleep 10
          done

      - name: Run e2e tests
        run: make test-e2e

      - name: Stop dev services
        if: always()
        run: make dev-down
